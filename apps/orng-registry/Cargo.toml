[package]
name = "orng-registry"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
orng-tools.workspace = true

# wgpu rather than glow, selected at run time in `main`. Windows often has no
# OpenGL driver at all - only Direct3D - so a GL-only renderer is a renderer
# that fails to start on a machine whose graphics are fine. eframe's default
# features are kept because they are what supply wgpu's platform backends;
# turning them off builds a wgpu with no backend and panics on the first frame.
eframe = { version = "0.36", features = ["wgpu"] }
orng-catalog.workspace = true

# Blocking, which is what suits a fetch already running on a worker thread, and
# rustls so there is no system TLS library to depend on across three platforms.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The native file picker behind `Add files...`. Drag and drop must never be the
# only way in, and a file dialog is the platform's to draw. The XDG portal
# rather than GTK on Linux: the portal is a D-Bus call to whatever the desktop
# already runs, so nothing here links a toolkit and no runner has to install
# one to build this. Named rather than left to the default, because the default
# is what would quietly become GTK again.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
egui-phosphor = { version = "0.14", default-features = false, features = ["light"] }

# The preferences file, `~/.orng/settings.toml`. TOML rather than JSON because
# this one is meant to be readable and editable by hand: it is five choices, and
# the first thing anybody debugging a placement will do is look at it. The entry
# list beside it is tab separated for a different reason entirely - the class
# injected into the installation reads that one, and `split("\t")` needs no
# parser at all.
serde = { version = "1", features = ["derive"] }
toml = "1"

# One date: when the backup of this build was taken. A `SystemTime` says nothing
# a reader can use, and turning one into a civil date in the reader's own zone is
# a calendar and a timezone database rather than arithmetic. `jiff` carries both
# and reads the platform's tzdb rather than assuming UTC, which is the difference
# between a backup dated correctly and one dated a day out west of Denver.
jiff = "0.2"

# Showing a document where it lives. The `reveal` feature is the whole reason
# this is here: the crate's own default is "open this file with whatever opens
# it", and opening a .bwdevice would launch Bitwig Studio - which is the one
# thing this application spends its time asking people to close. On Linux it
# reveals over D-Bus, which is the same choice `rfd` is configured for above:
# a call to whatever the desktop already runs, and no toolkit linked.
opener = { version = "0.8", features = ["reveal"] }

# Colour management is AppKit's, and neither eframe nor winit exposes it. A
# window that does not declare its colour space is handed to the panel
# untouched, which on a wide-gamut display stretches every sRGB colour the
# design specifies. Nothing else here needs AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
raw-window-handle = "0.6"

# Rendering the interface headlessly, so a change can be looked at rather than
# reasoned about. egui places widgets in ways that are hard to predict from the
# code alone - margins, baselines and available width especially - and a picture
# is the only honest check.
[dev-dependencies]
# The synthetic document fixture, so that what a test drops is built by the
# crate that knows the format rather than by a second copy of its header.
orng-tools = { workspace = true, features = ["testing"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
tempfile.workspace = true
