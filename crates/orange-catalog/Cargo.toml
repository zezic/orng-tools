[package]
name = "orange-catalog"
description = "The Orange Catalog repository format: manifests, index, and the rules that keep identities stable"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
bitwig-document.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"

[dev-dependencies]
bitwig-document.workspace = true
uuid = { workspace = true }
