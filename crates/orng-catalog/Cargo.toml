[package]
name = "orng-catalog"
description = "The Orng Catalog repository format: manifests, index, and the rules that keep identities stable"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
bitwig-document.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
# BSD-3-Clause, pure Rust, and four crates deep: curve25519-dalek, ed25519,
# sha2 and subtle. Permissive, so it does not change what this crate may be
# used in, and it shares the sha2 the digests already use.
ed25519-dalek = "3"
getrandom = "0.4"

[dev-dependencies]
bitwig-document.workspace = true
uuid = { workspace = true }
