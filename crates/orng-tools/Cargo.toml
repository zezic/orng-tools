[package]
name = "orng-tools"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
bitwig-install.workspace = true
bitwig-document.workspace = true
bitwig-classfile.workspace = true
bitwig-registry.workspace = true
orng-catalog.workspace = true
thiserror.workspace = true
uuid.workspace = true
tempfile.workspace = true

# Windows only, and only for one call. Linking the library folders needs a
# directory junction rather than a symbolic link, because a symbolic link there
# needs a privilege an ordinary account does not hold, and std has no way to
# ask for a junction.
[target.'cfg(windows)'.dependencies]
junction = "2"
