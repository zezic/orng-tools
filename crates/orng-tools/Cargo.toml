[package]
name = "orng-tools"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

# Fixtures for tests in crates above this one. Off by default: nothing a user
# installs needs a synthetic Bitwig document, and the knowledge of what one
# looks like should exist once in this workspace rather than once per test
# module that wants one.
[features]
testing = []

[dependencies]
bitwig-install.workspace = true
bitwig-document.workspace = true
bitwig-classfile.workspace = true
bitwig-registry.workspace = true
orng-catalog.workspace = true
thiserror.workspace = true
uuid.workspace = true
tempfile.workspace = true

# Windows only, and only for one call. Linking the library folders needs a
# directory junction rather than a symbolic link, because a symbolic link there
# needs a privilege an ordinary account does not hold, and std has no way to
# ask for a junction.
[target.'cfg(windows)'.dependencies]
junction = "2"

# The prepare tests mirror an installation, and mirroring its JVM means linking
# a directory. Same reason, same call.
[target.'cfg(windows)'.dev-dependencies]
junction = "2"
