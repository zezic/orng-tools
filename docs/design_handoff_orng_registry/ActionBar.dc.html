<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" />
<style>
@font-face{font-family:'Iosevka Extended';src:url('uploads/Iosevka-Extended.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Iosevka Extended';src:url('uploads/Iosevka-ExtendedBold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
html,body{margin:0;padding:0;background:#000}
a{color:#ff5a1f;text-decoration:none}
a:hover{color:#ff7a45}
:root{--page:#000000;--bg:#0a0a0a;--panel:#161616;--panel-2:#1e1e1e;--row:#0a0a0a;--row-alt:#1e1e1e;--row-hover:#262626;--zebra:rgba(255,255,255,.05);--line:#242424;--line-soft:#1a1a1a;--ink:#f2f2f2;--ink-2:#bcbcbc;--ink-3:#949494;--ink-2-warm:#c6b6aa;--ink-3-warm:#9e9089;--ink-2-err:#c9b4b1;--ink-3-err:#9d8c8a;--accent:#ff5a1f;--accent-text:#ff7a45;--accent-ink:#0a0a0a;--accent-soft:rgba(255,90,31,.10);--k-device:#a9a9a9;--k-device-bg:transparent;--k-mod:#a9a9a9;--k-mod-bg:transparent;--k-module:#a9a9a9;--k-module-bg:transparent;--ok:#f2f2f2;--ok-bg:rgba(242,242,242,.07);--warn:#ff5a1f;--warn-bg:rgba(255,90,31,.10);--err:#ff4036;--err-text:#ff6259;--err-bg:rgba(255,64,54,.10);--info:#a9a9a9;--info-bg:rgba(169,169,169,.08);--field:#000000;--btn:#282828;--btn-hover:#333333;--scrim:rgba(0,0,0,.74);--shadow:0 30px 80px rgba(0,0,0,.85);--shadow-menu:0 18px 40px rgba(0,0,0,.7);--shadow-panel:-18px 0 40px rgba(0,0,0,.5)}
</style>
</helmet>
<div style="position:relative; display:flex; align-items:center; gap:12px; flex:none; min-height:52px; padding:0 12px; background:var(--panel); font-family:Inter,'Helvetica Neue',Helvetica,sans-serif">
  <div style="display:flex; flex-direction:column; gap:3px; min-width:0; flex:1">
    <span style="font-size:11.5px; color:{{ summaryColor }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ summary }}</span>
    <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
      <span style="font-size:10.5px; color:var(--ink-3)">{{ note }}</span>
    </sc-if>
  </div>
  <sc-if value="{{ hasSecondary }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ onSecondary }}" style="display:flex; align-items:center; gap:6px; height:30px; padding:0 11px; flex:none; border-radius:3px; background:var(--btn); color:var(--ink-2); font-size:11.5px; cursor:pointer; white-space:nowrap" style-hover="background:var(--btn-hover); color:var(--ink)">
      <i class="{{ secondaryIcon }}" style="font-size:16px"></i><span>{{ secondary }}</span>
    </div>
  </sc-if>
  <div onClick="{{ onPrimary }}" title="{{ primaryTitle }}" style="{{ primaryStyle }}">
    <sc-if value="{{ elevate }}" hint-placeholder-val="{{ false }}"><i class="ph-light ph-shield" style="font-size:16px"></i></sc-if>
    <span>{{ primary }}</span>
    <i class="{{ primaryIcon }}" style="font-size:16px"></i>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:52},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 to add, 2 to fix&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;warn&quot;,&quot;err&quot;,&quot;ok&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Apply 4 changes&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;update&quot;,&quot;prepare&quot;],&quot;default&quot;:&quot;update&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabledReason&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nothing to apply&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ph-duotone ph-arrow-clockwise&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPrimary&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSecondary&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;elevate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const disabled = !!p.disabled;
    const tone = p.tone ?? "neutral";
    const mode = p.mode ?? "update";
    const toneColor = { neutral: "var(--ink-2)", warn: "var(--accent-text)", err: "var(--err-text)", ok: "var(--ink-2)" }[tone];
    return {
      summary: (p.summary ?? "Nothing pending"),
      summaryColor: toneColor,
      note: p.note ?? "", hasNote: !!p.note,
      secondary: p.secondary ?? "", hasSecondary: !!p.secondary,
      secondaryIcon: p.secondaryIcon ?? "ph-duotone ph-arrow-clockwise",
      primary: p.primary ?? "Apply changes",
      elevate: !!p.elevate,
      primaryTitle: disabled ? (p.disabledReason ?? "Nothing to apply") : "",
      primaryIcon: mode === "prepare" ? "ph-duotone ph-arrow-right" : "ph-duotone ph-check",
      primaryStyle: [
        "display:flex", "align-items:center", "gap:8px", "height:32px", "padding:0 14px", "flex:none",
        "border-radius:3px", "font-size:12px", "font-weight:600", "letter-spacing:-0.01em", "white-space:nowrap",
        "cursor:" + (disabled ? "default" : "pointer"),
        disabled
          ? "background:var(--btn); color:var(--ink-3)"
          : "background:var(--accent); color:var(--accent-ink)"
      ].join(";"),
      onPrimary: () => { if (!disabled && p.onPrimary) p.onPrimary(); },
      onSecondary: () => p.onSecondary && p.onSecondary()
    };
  }
}

</script>
</body>
</html>
