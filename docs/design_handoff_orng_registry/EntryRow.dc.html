<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" />
<style>
@font-face{font-family:'Iosevka Extended';src:url('uploads/Iosevka-Extended.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Iosevka Extended';src:url('uploads/Iosevka-ExtendedBold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
html,body{margin:0;padding:0;background:#000}
a{color:#ff5a1f;text-decoration:none}
a:hover{color:#ff7a45}
:root{--page:#000000;--bg:#0a0a0a;--panel:#161616;--panel-2:#1e1e1e;--row:#0a0a0a;--row-alt:#1e1e1e;--row-hover:#262626;--zebra:rgba(255,255,255,.05);--line:#242424;--line-soft:#1a1a1a;--ink:#f2f2f2;--ink-2:#bcbcbc;--ink-3:#949494;--ink-2-warm:#c6b6aa;--ink-3-warm:#9e9089;--ink-2-err:#c9b4b1;--ink-3-err:#9d8c8a;--accent:#ff5a1f;--accent-text:#ff7a45;--accent-ink:#0a0a0a;--accent-soft:rgba(255,90,31,.10);--k-device:#a9a9a9;--k-device-bg:transparent;--k-mod:#a9a9a9;--k-mod-bg:transparent;--k-module:#a9a9a9;--k-module-bg:transparent;--ok:#f2f2f2;--ok-bg:rgba(242,242,242,.07);--warn:#ff5a1f;--warn-bg:rgba(255,90,31,.10);--err:#ff4036;--err-text:#ff6259;--err-bg:rgba(255,64,54,.10);--info:#a9a9a9;--info-bg:rgba(169,169,169,.08);--field:#000000;--btn:#282828;--btn-hover:#333333;--scrim:rgba(0,0,0,.74);--shadow:0 30px 80px rgba(0,0,0,.8)}
</style>
</helmet>
<div style="font-family:Inter,'Helvetica Neue',Helvetica,sans-serif">
  <div onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onClick="{{ open }}" style="{{ rowStyle }}">
    <span style="font-size:11px; color:{{ secondaryInk }}; opacity:{{ dimOpacity }}">{{ kindLabel }}</span>
    <div style="display:flex; align-items:baseline; gap:9px; min-width:0; opacity:{{ dimOpacity }}">
      <sc-if value="{{ fromCatalog }}" hint-placeholder-val="{{ false }}">
        <i class="ph-duotone ph-package" title="{{ sourceTitle }}" style="font-size:16px; flex:none; color:{{ secondaryInk }}; align-self:center"></i>
      </sc-if>
      <span style="flex:0 1 auto; min-width:0; font-size:12.5px; font-weight:500; letter-spacing:-0.005em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:{{ nameColor }}; text-decoration:{{ nameDecoration }}">{{ name }}</span>
      <sc-if value="{{ showReason }}" hint-placeholder-val="{{ true }}">
        <span style="flex:0 200 auto; min-width:0; font-size:10.5px; color:{{ secondaryInk }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ reason }}</span>
      </sc-if>
    </div>
    <sc-if value="{{ showUuid }}" hint-placeholder-val="{{ true }}">
      <div title="{{ uuid }}" style="display:flex; align-items:center; gap:6px; font-family:'Iosevka Extended',Iosevka,monospace; letter-spacing:-0.05em; font-size:10.5px; color:{{ secondaryInk }}; opacity:{{ dimOpacity }}">
        <span>{{ uuidShort }}</span>
        <sc-if value="{{ showCopy }}" hint-placeholder-val="{{ true }}">
          <i class="ph-duotone ph-copy" style="font-size:16px; opacity:.5"></i>
        </sc-if>
      </div>
    </sc-if>
    <span style="font-size:11px; color:{{ statusFg }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ status }}</span>
    <div style="{{ actionsStyle }}">
      <sc-if value="{{ showAssign }}" hint-placeholder-val="{{ false }}">
        <div title="Assign new UUID" style="display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; color:var(--ink-2); cursor:pointer" style-hover="background:var(--btn-hover); color:var(--ink)"><i class="ph-duotone ph-fingerprint" style="font-size:16px"></i></div>
      </sc-if>
      <sc-if value="{{ showLocate }}" hint-placeholder-val="{{ false }}">
        <div title="Locate file" style="display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; color:var(--accent); cursor:pointer" style-hover="background:var(--accent-soft)"><i class="ph-duotone ph-file-magnifying-glass" style="font-size:16px"></i></div>
      </sc-if>
      <sc-if value="{{ showUndo }}" hint-placeholder-val="{{ false }}">
        <div title="Undo removal" style="display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; color:var(--ink-2); cursor:pointer" style-hover="background:var(--btn-hover); color:var(--ink)"><i class="ph-duotone ph-arrow-u-up-left" style="font-size:16px"></i></div>
      </sc-if>
      <sc-if value="{{ showReveal }}" hint-placeholder-val="{{ false }}">
        <div title="Reveal file" style="display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; color:var(--ink-2); cursor:pointer" style-hover="background:var(--btn-hover); color:var(--ink)"><i class="ph-duotone ph-folder-open" style="font-size:16px"></i></div>
      </sc-if>
      <sc-if value="{{ showRemove }}" hint-placeholder-val="{{ false }}">
        <div title="{{ removeLabel }}" style="display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; color:var(--ink-2); cursor:pointer" style-hover="background:var(--err-bg); color:var(--err)"><i class="ph-duotone ph-trash" style="font-size:16px"></i></div>
      </sc-if>
      <div title="More" style="display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; color:var(--ink-3); cursor:pointer" style-hover="background:var(--btn-hover); color:var(--ink)"><i class="ph-duotone ph-dots-three-vertical" style="font-size:16px"></i></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:796,&quot;height&quot;:36},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;DEVICE&quot;,&quot;MODULATOR&quot;,&quot;MODULE&quot;],&quot;default&quot;:&quot;DEVICE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;entryName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DISPERSER&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;uuid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;21882ab0-7c41-4d0b-9a10-ff3e5d2e77a1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Staged&quot;,&quot;Registered&quot;,&quot;Pending restart&quot;,&quot;Missing file&quot;,&quot;Changed&quot;,&quot;Update available&quot;,&quot;Conflict&quot;,&quot;Rejected&quot;,&quot;Pending removal&quot;,&quot;Factory&quot;],&quot;default&quot;:&quot;Registered&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reason&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;local&quot;,&quot;catalog&quot;],&quot;default&quot;:&quot;local&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Provenance&quot;},&quot;sourceVersion&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.2.0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Provenance&quot;},&quot;deleteFile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Settings in force&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;factory&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceActions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(name: string) =&gt; void&quot;}}">
const KIND = { DEVICE: "Device", MODULATOR: "Modulator", MODULE: "Module" };
const STATUS = {
  "Staged": "var(--ink-2)",
  "Registered": "var(--ink-3)",
  "Pending restart": "var(--ink-2)",
  "Missing file": "var(--err-text)",
  "Changed": "var(--accent-text)",
  "Update available": "var(--accent-text)",
  "Conflict": "var(--err-text)",
  "Rejected": "var(--ink-3)",
  "Pending removal": "var(--ink-3)",
  "Factory": "var(--ink-3)"
};

class Component extends DCLogic {
  state = { hover: false };
  renderVals() {
    const p = this.props;
    const status = p.status ?? "Registered";
    const kind = p.kind ?? "DEVICE";
    const factory = !!p.factory;
    const hot = this.state.hover || !!p.forceActions;
    const uuid = p.uuid ?? "00000000-0000-0000-0000-000000000000";
    const statusFg = STATUS[status] || STATUS.Registered;
    const selected = !!p.selected;
    const rejected = status === "Rejected";
    const narrow = !!p.narrow;

    return {
      name: p.entryName ?? p.name ?? "UNTITLED",
      reason: p.reason ?? "",
      uuid: rejected ? "" : uuid,
      uuidShort: rejected ? "\u2014" : uuid.split("-")[0],
      showCopy: !rejected,
      showUuid: !narrow, showReason: !narrow,
      nameColor: status === "Rejected" ? "var(--ink-2)" : "var(--ink)",
      secondaryInk: selected ? "var(--ink-3-warm)" : "var(--ink-3)",
      fromCatalog: (p.source ?? "local") === "catalog",
      sourceTitle: "Orange Catalog \u00b7 " + (p.sourceVersion ?? "1.2.0"),
      nameDecoration: status === "Pending removal" ? "line-through" : "none",
      status, statusFg,
      kindLabel: rejected ? "\u2014" : (KIND[kind] || kind),
      dimOpacity: 1,
      rowStyle: [
        "display:grid",
        "grid-template-columns:" + (narrow ? "66px minmax(0,1fr) 116px 76px" : "66px minmax(0,1fr) 106px 130px 84px"),
        "align-items:center",
        "gap:12px",
        "height:36px",
        "padding:0 12px",
        "cursor:" + (factory ? "default" : "pointer"),
        "background-color:" + (selected ? "rgba(255,90,31,.09)" : hot && !factory ? "var(--row-hover)" : "transparent")
      ].join(";"),
      actionsStyle: "display:flex; align-items:center; gap:1px; justify-content:flex-end; visibility:" + (hot && !factory ? "visible" : "hidden"),
      showReveal: !["Rejected", "Missing file", "Staged", "Conflict"].includes(status),
      showRemove: !["Rejected", "Pending removal"].includes(status),
      removeLabel: status === "Staged" || status === "Conflict"
        ? "Cancel"
        : p.deleteFile
          ? "Remove entry \u00b7 the document file is deleted too"
          : "Remove entry \u00b7 the document file is kept",
      showAssign: status === "Staged" || status === "Conflict",
      showLocate: status === "Missing file",
      showUndo: status === "Pending removal",
      enter: () => this.setState({ hover: true }),
      leave: () => this.setState({ hover: false }),
      open: () => { if (!factory && this.props.onOpen) this.props.onOpen(p.entryName ?? p.name); }
    };
  }
}

</script>
</body>
</html>
